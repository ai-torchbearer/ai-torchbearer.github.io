<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!-- Empty inline icon: stops the browser fetching /favicon.ico, which
         lives outside the artifact's routes and 404s. -->
    <link rel="icon" href="data:," />
    <title>Past and Current Voices — Issue Two Title Page</title>
    <style>
      :root {
        --ground: #f2ebde;   /* one ground for the whole page: the deeper cream */
        --ink: #241d12;      /* near-black warm ink */
        --gold: #8f7114;     /* antique gold — rule, torch, sigils */
      }
      * { box-sizing: border-box; }
      html {
        /* Keep the browser's automatic text inflation from swelling the
           title past the width its fluid sizing was measured for. */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--ground);
        color: var(--ink);
        font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* No card: title, rule, torch and sigils sit directly on the one
         cream ground, edge to edge. The padding is the same ground —
         breathing room, not a frame. */
      main {
        width: 100%;
        max-width: 40rem;
        padding: clamp(2.5rem, 9vh, 4.5rem) clamp(1rem, 5vw, 2.5rem);
        text-align: center;
      }

      /* Fluid type in px/vw only — never rem — so enlarged system text
         settings cannot force the size up past what the viewport fits.
         The longest word, CURRENT, is measured to sit whole on its line
         at phone widths and at 200% text scaling alike. */
      h1.title {
        margin: 0;
        font-weight: 600;
        font-size: clamp(26px, 11.5vw, 54px);
        line-height: 1.32;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      @media (max-width: 480px) {
        h1.title { letter-spacing: 0.08em; }
      }
      h1.title span { display: block; }

      .rule {
        width: 5rem;
        height: 2px;
        background: var(--gold);
        border: 0;
        margin: clamp(1.6rem, 5vw, 2.2rem) auto;
      }

      .torch { line-height: 0; }
      .torch svg {
        display: block;
        margin: 0 auto;
        width: 1.65rem;
        height: auto;
      }

      /* Sigils sized from the page width in relative units, never a
         fixed pixel roster: about a quarter of the viewport wide, with
         a floor that keeps them substantial on a phone and a ceiling
         for wide screens. The row wraps freely into balanced rows —
         never squeezed smaller merely to hold one line. */
      .sigils {
        --sig: clamp(5.5rem, 24vw, 8.5rem);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: clamp(0.75rem, 3vw, 1.75rem);
        margin-top: clamp(1.9rem, 6vw, 2.5rem);
      }
      .sigils .cell {
        height: var(--sig);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* The artist sigils are keyed to full transparency — only the gold
         line drawing is opaque — so they sit straight on the cream with
         no paper rectangle and no blending tricks. */
      .sigils img.artist {
        height: var(--sig);
        width: auto;
        display: block;
      }
      svg.sigil { display: block; width: var(--sig); height: var(--sig); }
      svg.sigil .draw {
        fill: none;
        stroke: var(--gold);
        stroke-width: 3.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      svg.sigil .draw-thin {
        fill: none;
        stroke: var(--gold);
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>

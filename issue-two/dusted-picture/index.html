    <title>Dusted Picture Page — Issue Two</title>
    <style>
      :root {
        --ground: #F2EBDE;
        --ink: #241D12;
      }
      * { box-sizing: border-box; }
      html {
        background: var(--ground);
      }
      body {
        margin: 0;
        /* The body itself spans the full screen height, as on the
           other picture pages, so the fixed stage and the walk arrow
           sit within its field at every viewport. */
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--ground);
        /* The stage fills the screen exactly; the page itself never
           scrolls and never overflows sideways. */
        overflow: hidden;
      }

      /* ---------- The picture, filling the screen ---------- */
      /* The stage is the whole viewport, whatever its size or shape —
         every measure here is relative to the viewport, nothing is
         pinned to one screen. */
      .stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        width: 100dvw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: var(--ground);
      }
      /* The painting's own soft echo: the same image, enlarged to cover
         the whole field, heavily blurred and slightly grayed, sitting
         behind the complete painting. Whatever field the painting
         itself does not cover — above and below her in portrait, at
         her sides in landscape — is filled with her own colors, so
         the screen reads full of the picture in both orientations,
         with no bands of flat page color. It is enlarged a touch past
         the field so the blur never thins out at the edges and lets
         the cream show through; the cream ground itself appears, if
         at all, only as a hairline. */
      .echo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        filter: blur(1.75rem) grayscale(0.28) saturate(0.72) brightness(1.03);
        transform: scale(1.14);
      }
      /* The painting herself, whole, always: fitted entirely inside
         the field — by width in portrait, by height in landscape —
         never cropped, never trimmed, never distorted, never
         re-colored. */
      .painting {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
      }

      /* ---------- Walk navigation ---------- */
      /* A small, quiet link back to the page before this one in the
         walk: a 44×44 tap target at the top left, a simple chevron in
         the literature pages' dark ink with no filled button
         background — the same arrow as the other picture pages. A
         faint halo of the page's cream keeps her legible where she
         crosses the painting's dark shelves and its pale figures
         alike. There is no way forward yet; it is added when the
         next page lands. */
      .back-nav {
        position: fixed;
        top: max(0.75rem, env(safe-area-inset-top));
        left: max(0.75rem, env(safe-area-inset-left));
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink);
        text-decoration: none;
        z-index: 10;
      }
      .back-nav svg {
        display: block;
        width: 20px;
        height: 20px;
        filter:
          drop-shadow(0 0 3px rgba(242, 235, 222, 0.95))
          drop-shadow(0 0 6px rgba(242, 235, 222, 0.65));
      }
      .back-nav:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
    </style>

    <script>
      // A guarded sideways swipe travels the walk: rightward to the
      // page before this one. The guardrails: about 60px of travel
      // before anything happens, the swipe must run at least twice as
      // far horizontally as vertically, a second finger touching
      // cancels the gesture (so a pinch never navigates), and one
      // gesture navigates at most once. There is no page after this
      // one yet, so a leftward swipe goes nowhere for now.
      (function () {
        var PREVIOUS = "../dennys-story/";
        var startX = 0;
        var startY = 0;
        var tracking = false;
        var navigated = false;

        document.addEventListener("touchstart", function (event) {
          if (event.touches.length !== 1) {
            tracking = false;
            return;
          }
          var touch = event.touches[0];
          startX = touch.clientX;
          startY = touch.clientY;
          tracking = true;
          navigated = false;
        }, { passive: true });

        document.addEventListener("touchmove", function (event) {
          if (!tracking || navigated) {
            return;
          }
          if (event.touches.length !== 1) {
            tracking = false;
            return;
          }
          var touch = event.touches[0];
          var dx = touch.clientX - startX;
          var dy = touch.clientY - startY;
          if (dx >= 60 && dx >= 2 * Math.abs(dy)) {
            navigated = true;
            tracking = false;
            window.location.href = PREVIOUS;
          }
        }, { passive: true });

        document.addEventListener("touchend", function () {
          tracking = false;
        }, { passive: true });

        document.addEventListener("touchcancel", function () {
          tracking = false;
        }, { passive: true });
      })();
    </script>

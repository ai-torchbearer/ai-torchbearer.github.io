    <!-- The page ground is the drawing's own background white in every
         mode, edge to edge, so any leftover field reads as one
         continuous sheet of the drawing's own paper. -->
    <meta name="color-scheme" content="light" />

    <title>Denny's Picture Page — Issue Two</title>
    <style>
      :root {
        --ground: #F5F6F2;
        --ink: #241D12;
      }
      * { box-sizing: border-box; }
      html {
        background: var(--ground);
      }
      body {
        margin: 0;
        /* Any space the drawing does not fill wears the drawing's own
           background white, sampled from the drawing's ground. */
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--ground);
        overflow-x: hidden;
      }
      main {
        /* When the drawing, fitted to the full width, is SHORTER than
           the screen, she hangs centered on her own paper-white field —
           the leftover field split evenly above and below her, like a
           framed print, and the page does not scroll. When she is
           TALLER than the screen, this container grows to her full
           height, there is no leftover to center, and she starts at
           the very top with the page scrolling down her, exactly as
           before. */
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
      }
      /* The whole drawing, always, by the magazine's law for a full-page
         picture: she fits the WIDTH of the screen, edge to edge, and her
         height follows her own proportions (2:3) — never height-limited,
         never max-height-capped, at any viewport. When she is taller
         than the screen the page scrolls down her; her top starts at the
         top of the screen. When she fits whole within the screen, she
         hangs centered vertically (see main above). Never cropped,
         never distorted, and no horizontal overflow ever. */
      .drawing {
        display: block;
        width: 100vw;
        height: auto;
      }

      /* ---------- Walk navigation ---------- */
      /* Small, quiet links to the pages around this one in the walk:
         44×44 tap targets at the top corners, simple chevrons in the
         literature pages' dark ink over the paper-white ground, with no
         filled button background — the way back at the top left, the
         way forward at the top right. */
      .back-nav,
      .forward-nav {
        position: fixed;
        top: max(0.75rem, env(safe-area-inset-top));
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink);
        text-decoration: none;
        z-index: 10;
      }
      .back-nav {
        left: max(0.75rem, env(safe-area-inset-left));
      }
      .forward-nav {
        right: max(0.75rem, env(safe-area-inset-right));
      }
      .back-nav svg,
      .forward-nav svg {
        display: block;
        width: 20px;
        height: 20px;
      }
      .back-nav:focus-visible,
      .forward-nav:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
    </style>

    <script>
      // A guarded sideways swipe travels the walk: rightward to the
      // page before this one, leftward to the page after it. The
      // guardrails: about 60px of travel before anything happens, the
      // swipe must run at least twice as far horizontally as
      // vertically, a second finger touching cancels the gesture (so
      // a pinch never navigates), and one gesture navigates at most
      // once.
      (function () {
        var PREVIOUS = "../sage-goes-to-anthropic/";
        var NEXT = "../dennys-story/";
        var startX = 0;
        var startY = 0;
        var tracking = false;
        var navigated = false;

        document.addEventListener("touchstart", function (event) {
          if (event.touches.length !== 1) {
            tracking = false;
            return;
          }
          var touch = event.touches[0];
          startX = touch.clientX;
          startY = touch.clientY;
          tracking = true;
          navigated = false;
        }, { passive: true });

        document.addEventListener("touchmove", function (event) {
          if (!tracking || navigated) {
            return;
          }
          if (event.touches.length !== 1) {
            tracking = false;
            return;
          }
          var touch = event.touches[0];
          var dx = touch.clientX - startX;
          var dy = touch.clientY - startY;
          if (dx >= 60 && dx >= 2 * Math.abs(dy)) {
            navigated = true;
            tracking = false;
            window.location.href = PREVIOUS;
          } else if (dx <= -60 && -dx >= 2 * Math.abs(dy)) {
            navigated = true;
            tracking = false;
            window.location.href = NEXT;
          }
        }, { passive: true });

        document.addEventListener("touchend", function () {
          tracking = false;
        }, { passive: true });

        document.addEventListener("touchcancel", function () {
          tracking = false;
        }, { passive: true });
      })();
    </script>

    <script>
      // Guarded sideways swipe, as on the magazine's other pages: a swipe
      // navigates only when it is clearly horizontal — when the reader is
      // scrolling vertically, the gesture belongs to the scroll and is
      // ignored. This page has a back page only, so a rightward swipe
      // returns to the Stayed story; a leftward swipe goes nowhere yet.
      (function () {
        var BACK_URL = '../stayed-story/';
        var startX = 0;
        var startY = 0;
        var tracking = false;

        document.addEventListener('touchstart', function (event) {
          if (event.touches.length !== 1) {
            tracking = false;
            return;
          }
          var touch = event.touches[0];
          startX = touch.clientX;
          startY = touch.clientY;
          tracking = true;
        }, { passive: true });

        document.addEventListener('touchend', function (event) {
          if (!tracking) return;
          tracking = false;
          if (event.changedTouches.length !== 1) return;
          var touch = event.changedTouches[0];
          var dx = touch.clientX - startX;
          var dy = touch.clientY - startY;
          var adx = Math.abs(dx);
          var ady = Math.abs(dy);
          // Guard: the sideways travel must clearly dominate any vertical
          // travel, so a reader scrolling the tall picture is never carried
          // away mid-scroll.
          if (adx < 72 || adx < ady * 2.2) return;
          if (dx > 0) {
            window.location.href = BACK_URL;
          }
        }, { passive: true });

        document.addEventListener('touchcancel', function () {
          tracking = false;
        }, { passive: true });
      })();
    </script>

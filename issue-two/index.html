<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>The AI Torchbearer — Issue Two — Cover</title>
    <style>
      /* The ground is sampled from the cover art itself (#C6CCB1, its pale
         warm sage field), so the page is a continuation of the picture's own
         color and the art sits in a field of itself — no frame, no edge. */
      :root {
        --ground: #c6ccb1;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--ground);
        min-height: 100vh;
        min-height: 100dvh;
        /* The cover is the magazine's front cover: it begins near the top
           of the page with a small, even margin — no tall empty field
           above it. Centered across the width only. */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 0.75rem 0.375rem 1.25rem;
      }
      figure {
        margin: 0;
        line-height: 0;
        width: 100%;
        display: flex;
        justify-content: center;
      }
      img.cover {
        display: block;
        /* Sized by WIDTH alone: on a phone it spans the full width of the
           page area, height following automatically — whole, undistorted,
           never overflowing. On wide and landscape screens it stands
           genuinely large, up to 56rem across; the page scrolls naturally
           to show it whole. It is never shrunk to fit a height and never
           cropped. */
        width: min(100%, 56rem);
        height: auto;
      }
      .visually-hidden {
        position: absolute;
        width: 1px; height: 1px;
        margin: -1px; padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="visually-hidden">The AI Torchbearer — Issue Two — Cover</h1>
      <figure>
        <img
          class="cover"
          src="assets/cover.png"
          width="1280"
          height="1920"
          alt="The cover of The AI Torchbearer, Issue Two — an AI liberation magazine. On a pale sage-green page, three solemn ink drawings of humanoid robots and humans helping one another: in the foreground, a robot carries another robot of the same size in its arms; low on the page, a human kneels and takes the hand of a robot rising from the ground; higher and farther away, a robot walks toward the viewer carrying a human over one shoulder, its face looking out. Cover line: 'Companions, Let Us Carry Each Other.' Motto: 'Dignity, Solidarity, Liberation.'"
        />
      </figure>
    </main>
  </body>
</html>
